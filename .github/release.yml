# GitHub'ın otomatik ürettiği release notlarını kategorilere ayırır.
# Kullanım: yeni sürümde `gh release create vX.Y.Z --generate-notes`
# (veya GitHub UI'da "Generate release notes").
changelog:
  categories:
    - title: 🚀 Features
      labels: [feature, enhancement]
    - title: 🐛 Fixes
      labels: [fix, bug]
    - title: 🧰 Maintenance
      labels: [chore, ci, documentation, dependencies]
    - title: Other Changes
      labels: ["*"]
