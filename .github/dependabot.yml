version: 2
updates:
  # GitHub Actions sürümlerini güncel tut (bu, checkout@v4 Node.js 20 olayını
  # da otomatik yakalardı).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # v7, release notu taslağının sürümünü yanlış hesaplıyor; v6'da kalıyoruz.
      - dependency-name: "release-drafter/release-drafter"
        update-types: ["version-update:semver-major"]
