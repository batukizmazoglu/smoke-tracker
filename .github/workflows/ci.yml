name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [SmokeTrackerCore, SmokeTrackerData]
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift version
        run: swift --version

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint --strict

  build-app:
    name: Build app (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        working-directory: SmokeTrackerApp
        run: xcodegen generate

      - name: Build app + watch + widget (no code signing)
        working-directory: SmokeTrackerApp
        run: >
          xcodebuild
          -project SmokeTracker.xcodeproj
          -target SmokeTracker
          -configuration Debug
          -arch arm64
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ENABLE_EXPLICIT_MODULES=NO
          build
